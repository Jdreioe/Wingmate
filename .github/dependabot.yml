version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /linuxApp
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /infra/opensymbols-proxy
    schedule:
      interval: weekly
      day: monday
    groups:
      opensymbols-proxy:
        patterns: ["*"]
