name: Deploy Google Play open beta release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.8.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-beta
  cancel-in-progress: false

jobs:
  verify:
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Compile, lint, and test Android
        run: bash ci_scripts/verify_android.sh
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run critical Android UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest --console=plain

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Set Android version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Expected a release tag such as v0.8.0" >&2
              exit 1
            fi
            version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            version_name="$REQUESTED_VERSION"
            if [[ ! "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Expected a version such as 0.8.0" >&2
              exit 1
            fi
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( 10#$minor > 999 || 10#$patch > 999 )); then
            echo "Minor and patch versions must be between 0 and 999" >&2
            exit 1
          fi

          # Deterministic so the production workflow can promote this exact build.
          # The base places tagged releases above codes produced by the old workflow.
          version_code=$((1000000000 + 10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android version code is outside Google's supported range" >&2
            exit 1
          fi

          echo "WINGMATE_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "WINGMATE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "release_tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Prepare tagged Play Store release notes
        run: bash ci_scripts/prepare_play_release_notes.sh "${{ steps.version.outputs.release_tag }}" beta

      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com

      - name: Publish to Google Play open beta
        run: >-
          ./gradlew :androidApp:publishReleaseBundle
          --track beta
          --release-name "Wingmate $WINGMATE_VERSION_NAME"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-${{ steps.version.outputs.release_tag }}
          path: androidApp/build/outputs/bundle/release/app-release.aab
