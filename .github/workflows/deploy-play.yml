name: Deploy to Google Play

on:
  push:
    tags:
      - "prod/*"
      - "staging/*"

permissions:
  contents: read

concurrency:
  group: google-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure release from tag
        id: release
        shell: bash
        run: |
          channel="${GITHUB_REF_NAME%%/*}"
          version="${GITHUB_REF_NAME#*/}"

          if [[ ! "$version" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be prod/1.x.y or staging/1.x.y"
            exit 1
          fi

          case "$channel" in
            prod) track="production" ;;
            staging) track="alpha" ;;
            *)
              echo "::error::Unknown release channel: $channel"
              exit 1
              ;;
          esac

          version_code=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "WINGMATE_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "WINGMATE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "PLAY_TRACK=$track" >> "$GITHUB_ENV"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Infisical CLI
        run: |
          set -o pipefail
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical
          infisical --version

      - name: Publish to Google Play
        run: infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod -- ./gradlew publishReleaseBundle --track "$PLAY_TRACK"
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ad96050f-9132-4f4e-ae16-e46e4c5734fc
          INFISICAL_API_URL: https://eu.infisical.com
          INFISICAL_SKIP: "1"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ steps.release.outputs.channel }}-${{ steps.release.outputs.version }}
          path: androidApp/build/outputs/bundle/release/app-release.aab
