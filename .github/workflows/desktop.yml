name: Desktop

on:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release-desktop.yml"
      - "desktopApp/**"
      - "shared/**"
      - "core/**"
      - "feature/communication/**"
      - "*.gradle.kts"
      - "gradle/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release-desktop.yml"
      - "desktopApp/**"
      - "shared/**"
      - "core/**"
      - "feature/communication/**"
      - "*.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin/Native emits a GNU-ABI static library for mingwX64, so the
          # Windows job must use the windows-gnu Rust target. The MSVC default
          # cannot link that archive.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            kotlin_target: LinuxX64
            test_kotlin_build_type: Debug
            gradle: ./gradlew
            package_format: deb
            artifact_name: wingmate-linux
            artifact_path: desktopApp/target/x86_64-unknown-linux-gnu/release/*.deb
          - os: macos-14
            target: aarch64-apple-darwin
            kotlin_target: MacosArm64
            test_kotlin_build_type: Debug
            gradle: ./gradlew
            package_format: dmg
            artifact_name: wingmate-macos
            artifact_path: desktopApp/target/aarch64-apple-darwin/release/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            kotlin_target: MingwX64
            test_kotlin_build_type: Release
            gradle: .\gradlew.bat
            package_format: wix
            artifact_name: wingmate-windows
            artifact_path: desktopApp/target/x86_64-pc-windows-gnu/release/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - name: Install the Linux windowing and speech libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev speech-dispatcher
      - name: Put the MinGW linker on PATH
        if: matrix.os == 'windows-latest'
        shell: bash
        run: printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
      - name: Build test Kotlin bridge
        run: ${{ matrix.gradle }} :desktopApp:bindings:link${{ matrix.test_kotlin_build_type }}Static${{ matrix.kotlin_target }} --console=plain --build-cache
      - name: Test Rust shell
        working-directory: desktopApp
        run: cargo test --locked --target ${{ matrix.target }}
        env:
          WINGMATE_KOTLIN_BRIDGE_PREBUILT: "1"
      - name: Build release Kotlin bridge
        run: ${{ matrix.gradle }} :desktopApp:bindings:linkReleaseStatic${{ matrix.kotlin_target }} --console=plain --build-cache
      - name: Build release Rust shell
        working-directory: desktopApp
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          WINGMATE_KOTLIN_BRIDGE_PREBUILT: "1"
      - name: Install desktop packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build unsigned installer
        working-directory: desktopApp
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.package_format }}
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
