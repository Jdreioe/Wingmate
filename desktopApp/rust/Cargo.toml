[package]
name = "wingmate-desktop"
version = "0.7.0"
edition = "2024"
description = "Wingmate cross-platform AAC desktop client"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.22"
iced = { version = "0.14", features = ["image", "tokio"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[package.metadata.packager]
product-name = "Wingmate"
identifier = "io.github.jdreioe.wingmate"
publisher = "Wingmate"
authors = ["Jonas Dreiøe"]
homepage = "https://github.com/Jdreioe/Wingmate"
category = "Medical"
license-file = "../../LICENSE"
icons = ["../../iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/Icon-iOS-Default-1024x1024@1x.png"]
long-description = "Wingmate is a free and open-source AAC application for people who cannot rely on speech."

[[package.metadata.packager.binaries]]
path = "wingmate-desktop"
main = true

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.deb]
depends = ["speech-dispatcher"]

[package.metadata.packager.windows]
allow-downgrades = false
