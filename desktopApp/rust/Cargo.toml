[package]
name = "wingmate-desktop"
version = "0.7.0"
edition = "2024"
description = "Wingmate cross-platform AAC desktop client"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.22"
iced = { version = "0.14", features = ["image", "tokio"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
