[package]
name = "wingmate-kde"
version = "1.0.0"
edition = "2021"
description = "Wingmate Desktop - native Linux communication aid"
default-run = "wingmate-kde"

[lib]
name = "wingmate_kde"
path = "src/lib.rs"

[[bin]]
name = "wingmate-kde"
path = "src/main.rs"

[[bin]]
name = "partner-window-test"
path = "src/bin/partner_window_test.rs"
required-features = ["partner-window"]

[[bin]]
name = "head-tracking-test"
path = "src/bin/head_tracking_test.rs"
required-features = ["tracking"]

[features]
default = []
partner-window = [
    "dep:ftdi-embedded-hal",
    "dep:ftdi",
    "dep:embedded-hal",
    "dep:miniz_oxide",
]
# Optional head/eye tracking pipeline (MediaPipe + webcam). Disabled by default
# so the base build has no camera/model runtime dependency.
tracking = [
    "dep:mediapipe",
    "dep:nokhwa",
]

[dependencies]
iced = { version = "0.14", features = ["tokio", "wgpu"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
url = "2"
rfd = "0.15"

# EVE display driver via FTDI FT232H
ftdi-embedded-hal = { version = "0.24", features = ["ftdi"], optional = true }
ftdi = { version = "0.1", optional = true }
embedded-hal = { version = "1.0", optional = true }
miniz_oxide = { version = "0.8", optional = true }

# Head/eye tracking: MediaPipe Tasks bindings + webcam capture (Linux native).
mediapipe = { version = "0.1", optional = true }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"], optional = true }

# CLI test binary
clap = { version = "4", features = ["derive"] }

# Signal handling for graceful shutdown
ctrlc = "3.4"
