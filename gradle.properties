# Keep builds from monopolizing the machine. The iOS release framework needs
# more than 2 GiB after the project was split into additional KMP modules, while
# two workers still leave enough memory for Xcode on Xcode Cloud.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:ActiveProcessorCount=3
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.priority=low
kotlin.daemon.jvmargs=-Xmx2g -XX:ActiveProcessorCount=2
kotlin.code.style=official
kotlin.incremental=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.native.ignoreDisabledTargets=true
org.gradle.configuration-cache=true
